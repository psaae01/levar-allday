<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>All-day Pairing Studio — LEVAR</title>
<meta property="og:title" content="All-day Pairing Studio — LEVAR">
<meta property="og:description" content="라운드 하나, 브이넥 하나. 나만의 여름 페어를 직접 조합해보세요.">
<link rel="stylesheet" href="https://use.typekit.net/ltk8xvz.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  :root{--bk:#888888;--gy:#aaaaaa;--gy2:#c6c6c6;--hl:#eeeeee;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"minerva-modern",'Pretendard',sans-serif;
    font-size:14px;font-weight:300;letter-spacing:0;color:var(--bk);background:#fff;
    display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:430px;padding:64px 26px 96px;display:flex;flex-direction:column;align-items:center;}
  .logo{margin-bottom:64px;}
  .logo img{height:19px;display:block;}
  .eyebrow{font-size:11px;color:var(--gy);text-transform:uppercase;text-align:center;}
  h1{font-size:16.5px;font-weight:300;line-height:1.5;text-align:center;word-break:keep-all;}
  .sub{font-size:12px;color:var(--gy);line-height:1.8;text-align:center;word-break:keep-all;}
  .btn{
    display:block;width:260px;max-width:100%;margin-left:auto;margin-right:auto;padding:15px 0;
    border:1px solid var(--bk);background:#fff;color:var(--bk);
    font-family:inherit;font-size:13px;font-weight:400;text-transform:uppercase;
    text-align:center;text-decoration:none;cursor:pointer;
    transition:background .25s,color .25s,opacity .2s;
  }
  .btn:active{background:var(--bk);color:#fff;}
  .btn.fill{background:var(--bk);color:#fff;}
  .btn.fill:active{opacity:.7;}
  .btn.quiet{border-color:var(--hl);color:var(--gy);}
  .tlink{
    font-size:12px;text-transform:uppercase;color:var(--bk);
    background:none;border:none;font-family:inherit;font-weight:300;cursor:pointer;
    text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:.5px;
    text-decoration-color:var(--gy2);
  }
  .tlink.muted{color:var(--gy);}
  .screen{display:none;width:100%;flex-direction:column;align-items:center;animation:fade .5s ease;}
  .screen.on{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;} *{transition:none!important;}}
  .foot{margin-top:72px;font-size:11px;color:var(--gy2);text-transform:uppercase;text-align:center;}
  .toast{
    position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
    background:var(--bk);color:#fff;font-size:12px;
    padding:12px 24px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;
  }
  .toast.show{opacity:1;}

  h1{margin-top:20px;}
  .sub{margin-top:18px;margin-bottom:58px;}
  .stage{display:flex;gap:16px;width:100%;}
  .col{flex:1;display:flex;flex-direction:column;}
  .colHead{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--hl);
  }
  .colHead b{font-size:12px;font-weight:300;text-transform:uppercase;}
  .colHead span{font-size:12px;color:var(--gy2);font-variant-numeric:tabular-nums;}
  .tileBox img{width:100%;display:block;opacity:0;transition:opacity .45s ease;}
  .tileBox img.ld{opacity:1;}
  .cname{font-size:13px;color:var(--bk);margin-top:12px;min-height:16px;}
  .cname em{font-style:normal;color:var(--gy2);margin-right:8px;font-size:11px;font-variant-numeric:tabular-nums;}
  .swatches{display:flex;flex-wrap:wrap;gap:10px 11px;margin-top:16px;}
  .sw{
    width:15px;height:15px;border-radius:50%;
    border:1px solid rgba(136,136,136,.25);cursor:pointer;padding:0;position:relative;
  }
  .sw::after{
    content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:0;height:1px;background:var(--bk);transition:width .25s ease;
  }
  .sw.sel::after{width:70%;}
  .tools{display:flex;gap:40px;justify-content:center;margin:56px 0 44px;}
  .buy{width:100%;display:flex;flex-direction:column;gap:12px;}
  .note{font-size:12px;color:var(--gy);text-align:center;margin-top:36px;line-height:2.1;word-break:keep-all;}
  .note a{color:var(--gy);text-underline-offset:5px;text-decoration-thickness:.5px;}
</style>
</head>

];
let selR=3, selV=0;
const $=id=>document.getElementById(id);
function renderSwatches(list, elId, kind){
  const box=$(elId); box.innerHTML="";
  list.forEach((c,i)=>{
    const s=document.createElement("button");
    s.className="sw"; s.style.background=c.hex;
    s.title=c.label; s.setAttribute("aria-label",c.label);
    if(c.light) s.style.borderColor="#dedede";
    s.onclick=()=>{ if(kind==="R"){selR=i;}else{selV=i;} update(); };
    box.appendChild(s);
  });
}
function pad(n){return String(n).padStart(2,"0");}
function swapImg(el, src){
  el.classList.remove("ld");
  const t=new Image();
  t.onload=()=>{ el.src=src; requestAnimationFrame(()=>el.classList.add("ld")); };
  t.src=src;
}
function update(){
  const r=ROUND[selR], v=VNECK[selV];
  swapImg($("imgR"), r.img); swapImg($("imgV"), v.img);
  $("nameR").innerHTML="<em>"+pad(selR+1)+"</em>"+r.label;
  $("nameV").innerHTML="<em>"+pad(selV+1)+"</em>"+v.label;
  $("idxR").textContent=pad(selR+1)+" — "+pad(ROUND.length);
  $("idxV").textContent=pad(selV+1)+" — "+pad(VNECK.length);
  document.querySelectorAll("#swR .sw").forEach((s,i)=>s.classList.toggle("sel",i===selR));
  document.querySelectorAll("#swV .sw").forEach((s,i)=>s.classList.toggle("sel",i===selV));
  $("buyC").href=URL_COMBINED;
  history.replaceState(null,"",location.pathname+"?r="+r.key+"&v="+v.key);
}
function shuffle(){
  selR=Math.floor(Math.random()*ROUND.length);
  selV=Math.floor(Math.random()*VNECK.length);
  update();
}
function sharePair(){
  const r=ROUND[selR], v=VNECK[selV];
  const text=`나의 올데이 페어: 라운드 ${r.label} × 브이넥 ${v.label} — LEVAR`;
  if(navigator.share){ navigator.share({title:"All-day Pairing Studio",text,url:location.href}).catch(()=>{}); }
  else{ navigator.clipboard.writeText(location.href).then(()=>{ $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1800); }); }
}
(function init(){
  renderSwatches(ROUND,"swR","R");
  renderSwatches(VNECK,"swV","V");
  const p=new URLSearchParams(location.search);
  const ri=ROUND.findIndex(c=>c.key===p.get("r"));
  const vi=VNECK.findIndex(c=>c.key===p.get("v"));
  if(ri>=0) selR=ri; if(vi>=0) selV=vi;
  update();
})();
</script>
