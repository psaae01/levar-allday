<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My All-day Pairing — LEVAR</title>
<meta property="og:title" content="My All-day Pairing — LEVAR">
<meta property="og:description" content="30초 테스트로 나의 여름 티셔츠 페어링을 찾아보세요.">
<link rel="stylesheet" href="https://use.typekit.net/ltk8xvz.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  :root{--bk:#888888;--gy:#aaaaaa;--gy2:#c6c6c6;--hl:#eeeeee;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"minerva-modern",'Pretendard',sans-serif;
    font-size:14px;font-weight:300;letter-spacing:0;color:var(--bk);background:#fff;
    display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:430px;padding:64px 26px 96px;display:flex;flex-direction:column;align-items:center;}
  .logo{margin-bottom:64px;}
  .logo img{height:19px;display:block;}
  .eyebrow{font-size:11px;color:var(--gy);text-transform:uppercase;text-align:center;}
  h1{font-size:16.5px;font-weight:300;line-height:1.5;text-align:center;word-break:keep-all;}
  .sub{font-size:12px;color:var(--gy);line-height:1.8;text-align:center;word-break:keep-all;}
  .btn{
    display:block;width:260px;max-width:100%;margin-left:auto;margin-right:auto;padding:15px 0;
    border:1px solid var(--bk);background:#fff;color:var(--bk);
    font-family:inherit;font-size:13px;font-weight:400;text-transform:uppercase;
    text-align:center;text-decoration:none;cursor:pointer;
    transition:background .25s,color .25s,opacity .2s;
  }
  .btn:active{background:var(--bk);color:#fff;}
  .btn.fill{background:var(--bk);color:#fff;}
  .btn.fill:active{opacity:.7;}
  .btn.quiet{border-color:var(--hl);color:var(--gy);}
  .tlink{
    font-size:12px;text-transform:uppercase;color:var(--bk);
    background:none;border:none;font-family:inherit;font-weight:300;cursor:pointer;
    text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:.5px;
    text-decoration-color:var(--gy2);
  }
  .tlink.muted{color:var(--gy);}
  .screen{display:none;width:100%;flex-direction:column;align-items:center;animation:fade .5s ease;}
  .screen.on{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;} *{transition:none!important;}}
  .foot{margin-top:72px;font-size:11px;color:var(--gy2);text-transform:uppercase;text-align:center;}
  .cardOverlay{
    position:fixed;inset:0;background:rgba(255,255,255,.96);
    display:none;justify-content:center;align-items:center;z-index:20;padding:24px;
  }
  .cardOverlay.on{display:flex;}
  .cardBox{display:flex;flex-direction:column;align-items:center;max-width:340px;width:100%;}
  .cardBox img{width:100%;max-height:64vh;object-fit:contain;border:1px solid var(--hl);}
  .cardGuide{font-size:13px;color:var(--bk);line-height:1.9;text-align:center;margin:20px 0 18px;word-break:keep-all;}
  .cardGuide b{font-weight:500;}
  .cardActs{display:flex;gap:32px;}
  .toast{
    position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
    background:var(--bk);color:#fff;font-size:12px;
    padding:12px 24px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;
  }
  .toast.show{opacity:1;}

  h1{margin-top:20px;}
  #intro .sub{margin-top:18px;}
  #intro .pair{display:flex;gap:14px;margin:52px 0 0;width:100%;}
  #intro .pair .ph{width:calc(50% - 7px);}
  #intro .pair img{width:100%;display:block;}
  #intro .cap{font-size:11px;color:var(--gy2);text-transform:uppercase;margin-top:10px;}
  #intro .btn{margin-top:56px;}
  .qhead{width:100%;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .qhead span{font-size:12px;color:var(--gy);text-transform:uppercase;font-variant-numeric:tabular-nums;}
  .progress{width:100%;height:1px;background:var(--hl);position:relative;margin-bottom:64px;}
  .progress i{position:absolute;left:0;top:0;height:1px;background:var(--bk);transition:width .4s ease;}
  .qtext{font-size:16.5px;font-weight:300;line-height:1.6;text-align:center;word-break:keep-all;min-height:62px;}
  .opts{width:100%;margin-top:44px;border-top:1px solid var(--hl);}
  .opt{
    width:100%;display:flex;align-items:center;gap:18px;
    padding:21px 4px;border:none;border-bottom:1px solid var(--hl);
    background:#fff;font-family:inherit;font-size:14px;font-weight:300;color:var(--bk);
    text-align:left;cursor:pointer;word-break:keep-all;line-height:1.6;
    transition:padding-left .25s ease;
  }
  .opt em{font-style:normal;font-size:11px;color:var(--gy2);min-width:14px;}
  .opt:active{padding-left:12px;background:#fcfcfc;}
  #result .rTitle{font-size:16.5px;font-weight:300;text-align:center;margin-top:20px;}
  .rTees{display:flex;gap:14px;width:100%;margin:48px 0 0;}
  .tee{width:calc(50% - 7px);display:flex;flex-direction:column;}
  .tee img{width:100%;display:block;}
  .teeMeta{display:flex;flex-direction:column;gap:5px;padding-top:11px;}
  .teeMeta b{font-size:11px;font-weight:300;text-transform:uppercase;color:var(--gy2);}
  .teeMeta span{font-size:12px;}
  .rCopy{font-size:14px;line-height:1.8;text-align:center;word-break:keep-all;margin:48px 0 52px;max-width:360px;}
  .rBtns{width:100%;display:flex;flex-direction:column;gap:12px;}
  .tools{display:flex;gap:40px;margin-top:44px;}
</style>
</head>

const STUDIO_MAP={TOMATO:["TomatoRed","OffWhite"],BUTTER:["CreamButter","CottonCandyPink"],SODA:["FloridaMint","PolarSkyBlue"],MONO:["MelangeGrey","Black"],NAVY:["ClassicNavy","DustyBlue"],MOCHA:["EspressoBrown","DustyRose"]};
const QUESTIONS=[
 {q:"아침에 눈 뜨자마자 드는 생각은?",o:[
   ["오늘 뭐 입지",["MONO","NAVY"]],
   ["커피부터 마시자",["MOCHA","BUTTER"]],
   ["날씨 좋다, 나가고 싶다",["TOMATO","SODA"]]]},
 {q:"지금 당장 여름휴가를 떠난다면?",o:[
   ["바다. 무조건 수영",["SODA","TOMATO"]],
   ["조용한 도시, 미술관 투어",["MONO","NAVY"]],
   ["근교 카페에서 느긋하게",["BUTTER","MOCHA"]]]},
 {q:"카페에서 나의 주문은?",o:[
   ["아이스 아메리카노 원샷",["MONO","TOMATO"]],
   ["크림 올라간 달달한 라떼",["BUTTER","MOCHA"]],
   ["청량한 에이드나 스파클링",["SODA","NAVY"]]]},
 {q:"내 옷장을 열어보면?",o:[
   ["무채색이 90%",["MONO","NAVY"]],
   ["파스텔이 은근히 많다",["BUTTER","SODA"]],
   ["포인트 컬러 몇 개는 있어야지",["TOMATO","MOCHA"]]]},
 {q:"인생 모토에 가장 가까운 것은?",o:[
   ["심플 이즈 베스트",["NAVY","MONO"]],
   ["오늘이 제일 젊다",["TOMATO","SODA"]],
   ["부드럽게, 그리고 꾸준히",["BUTTER","MOCHA"]]]}
];
let scores={}, step=0;
const $=id=>document.getElementById(id);
const ABC=["A","B","C","D"];
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on"); window.scrollTo(0,0);
}
function startQuiz(){
  scores={TOMATO:0,BUTTER:0,SODA:0,MONO:0,NAVY:0,MOCHA:0};
  step=0; show("quiz"); renderQ();
}
function renderQ(){
  const item=QUESTIONS[step];
  $("bar").style.width=(step/QUESTIONS.length*100)+"%";
  $("qnum").textContent=String(step+1).padStart(2,"0")+" — "+String(QUESTIONS.length).padStart(2,"0");
  $("qtext").textContent=item.q;
  const box=$("opts"); box.innerHTML="";
  item.o.forEach(([label,types],i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML="<em>"+ABC[i]+"</em>"+label;
    b.onclick=()=>{ types.forEach(t=>scores[t]++); next(); };
    box.appendChild(b);
  });
}
function next(){
  step++;
  if(step<QUESTIONS.length){ renderQ(); }
  else{
    $("bar").style.width="100%";
    const key=Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];
    setTimeout(()=>showResult(key),300);
  }
}
function showResult(key){
  const r=RESULTS[key];
  $("rTitle").textContent=r.name;
  $("rTees").innerHTML=
    '<div class="tee"><img src="'+TILES[r.r[0]]+'" alt=""><div class="teeMeta"><b>Round</b><span>'+r.r[1]+'</span></div></div>'+
    '<div class="tee"><img src="'+TILES[r.v[0]]+'" alt=""><div class="teeMeta"><b>V-neck</b><span>'+r.v[1]+'</span></div></div>';
  $("rCopy").innerHTML=r.copy.split(". ").map((s,i,a)=>i<a.length-1?s+".":s).join("<br>");
  $("linkCombined").href=URL_COMBINED;
  $("linkStudio").href="studio.html?r="+STUDIO_MAP[key][0]+"&v="+STUDIO_MAP[key][1];
  history.replaceState(null,"",location.pathname+"?r="+key);
  show("result");
}
async function buildResultCard(key){
  const r=RESULTS[key];
  const W=1080,H=1920;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
  try{ await document.fonts.load('300 82px "Pretendard"'); await document.fonts.load('300 36px "Pretendard"'); await document.fonts.load('400 30px "minerva-modern"'); await document.fonts.ready; }catch(e){}
  const loadImg=src=>new Promise(res=>{const i=new Image(); i.onload=()=>res(i); i.src=src;});
  // logo
  const logoEl=document.querySelector(".logo img");
  if(logoEl){ const lg=await loadImg(logoEl.src); const lh=44, lw=lg.width/lg.height*lh; ctx.drawImage(lg,(W-lw)/2,210,lw,lh); }
  ctx.textAlign="center";
  ctx.fillStyle="#aaaaaa"; ctx.font='400 30px "minerva-modern","Pretendard",sans-serif';
  ctx.fillText("MY ALL-DAY PAIRING", W/2, 400);
  ctx.fillStyle="#888888"; ctx.font='300 82px "Pretendard",sans-serif';
  ctx.fillText(r.name, W/2, 512);
  // tees
  const tR=await loadImg(TILES[r.r[0]]), tV=await loadImg(TILES[r.v[0]]);
  const tw=470, th=tw*tR.height/tR.width, gap=32, x0=(W-(tw*2+gap))/2, ty=610;
  ctx.drawImage(tR,x0,ty,tw,th); ctx.drawImage(tV,x0+tw+gap,ty,tw,th);
  const cy=ty+th+72;
  ctx.fillStyle="#aaaaaa"; ctx.font='400 26px "minerva-modern","Pretendard",sans-serif';
  ctx.fillText("ROUND", x0+tw/2, cy); ctx.fillText("V-NECK", x0+tw+gap+tw/2, cy);
  ctx.fillStyle="#888888"; ctx.font='400 34px "minerva-modern","Pretendard",sans-serif';
  ctx.fillText(r.r[1], x0+tw/2, cy+52); ctx.fillText(r.v[1], x0+tw+gap+tw/2, cy+52);
  // copy (2 lines max, split by sentence)
  ctx.font='300 36px "Pretendard",sans-serif';
  const parts=r.copy.split(". ").map((s,i,a)=>i<a.length-1?s+".":s);
  parts.forEach((line,i)=>ctx.fillText(line, W/2, cy+180+i*62));
  return new Promise(res=>cv.toBlob(b=>res(b),"image/png"));
}

function closeCard(){ $("cardOverlay").classList.remove("on"); }
let __cardBlob=null;
function openCard(blob){
  __cardBlob=blob;
  const u=URL.createObjectURL(blob);
  $("cardImg").src=u; $("cardDl").href=u;
  const file=new File([blob],"levar-pairing.png",{type:"image/png"});
  $("cardShare").style.display=(navigator.canShare&&navigator.canShare({files:[file]}))?"":"none";
  $("cardOverlay").classList.add("on");
}
async function shareCardBlob(){
  if(!__cardBlob) return;
  const key=new URLSearchParams(location.search).get("r");
  const text=key&&RESULTS[key] ? "나의 올데이 페어링은 '"+RESULTS[key].name+"' — LEVAR "+location.href : location.href;
  const file=new File([__cardBlob],"levar-pairing.png",{type:"image/png"});
  try{ await navigator.share({files:[file], text}); }catch(e){}
}
async function saveCard(){
  const key=new URLSearchParams(location.search).get("r");
  if(!key||!RESULTS[key]) return;
  try{ openCard(await buildResultCard(key)); }catch(e){}
}
function copyResultLink(){
  navigator.clipboard.writeText(location.href).then(()=>{ $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1800); });
}
async function shareResult(){
  const url=location.href;
  const key=new URLSearchParams(location.search).get("r");
  const text=key&&RESULTS[key] ? "나의 올데이 페어링은 '"+RESULTS[key].name+"' — LEVAR" : "나의 올데이 페어링 — LEVAR";
  if(key&&RESULTS[key]){
    try{
      const blob=await buildResultCard(key);
      const file=new File([blob],"levar-pairing.png",{type:"image/png"});
      // 1) 이미지 파일 공유 지원 -> 공유시트 (인스타 '스토리에 추가' 가능)
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], text:text+" "+url}); return; }
        catch(e){ if(e&&e.name==="AbortError") return; }
      }
      // 2) 미지원 -> 카드 오버레이 (꾹 눌러 저장)
      openCard(blob);
      return;
    }catch(e){}
  }
  // 3) 최종 폴백: URL 공유/복사
  if(navigator.share){ navigator.share({title:"My All-day Pairing",text,url}).catch(()=>{}); }
  else{ copyResultLink(); }
}
(function init(){
  const key=new URLSearchParams(location.search).get("r");
  if(key&&RESULTS[key]) showResult(key);
})();
</script>
